services:
  postgres:
    image: postgres:18-alpine
    container_name: btc-assistant-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-btc_assistant}
      POSTGRES_USER: ${DB_USER:-btc_assistant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-btc_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-btc_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: btc-assistant-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-btc_assistant}
      DB_USER: ${DB_USER:-btc_assistant}
      DB_PASSWORD: ${DB_PASSWORD:-btc_assistant}
      SERVER_PORT: 8080
      BACKFILL_ENABLED: ${BACKFILL_ENABLED:-true}
      BACKFILL_PERIOD: ${BACKFILL_PERIOD:-12-months}
      BACKFILL_MAX_RETRIES: ${BACKFILL_MAX_RETRIES:-3}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    container_name: btc-assistant-web
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
