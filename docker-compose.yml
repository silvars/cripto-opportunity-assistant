services:
  postgres:
    image: postgres:18-alpine
    container_name: btc-assistant-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-btc_assistant}
      POSTGRES_USER: ${DB_USER:-btc_assistant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-btc_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-btc_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: btc-assistant-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-btc_assistant}
      DB_USER: ${DB_USER:-btc_assistant}
      DB_PASSWORD: ${DB_PASSWORD:-btc_assistant}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
