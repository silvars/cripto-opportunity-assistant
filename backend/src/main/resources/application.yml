spring:
  application:
    name: btc-opportunity-assistant
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:btc_assistant}
    username: ${DB_USER:btc_assistant}
    password: ${DB_PASSWORD:btc_assistant}
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

market:
  backfill:
    max-retries: ${BACKFILL_MAX_RETRIES:3}
  instruments:
    - symbol: BTCUSDT
      base-asset: BTC
      quote-asset: USDT
      exchange: BINANCE
      interval: 1m
      enabled: true
      historical-backfill:
        enabled: ${BACKFILL_ENABLED:true}
        period: ${BACKFILL_PERIOD:12-months}
