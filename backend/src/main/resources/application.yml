spring:
  application:
    name: btc-opportunity-assistant
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:btc_assistant}
    username: ${DB_USER:btc_assistant}
    password: ${DB_PASSWORD:btc_assistant}
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

market:
  backfill:
    max-retries: ${BACKFILL_MAX_RETRIES:3}
  instruments:
    - symbol: BTCUSDT
      base-asset: BTC
      quote-asset: USDT
      exchange: BINANCE
      interval: 1m
      enabled: true
      historical-backfill:
        enabled: ${BACKFILL_ENABLED:true}
        period: ${BACKFILL_PERIOD:12-months}

feature-engine:
  version: "1.0"
  windows:
    volume-sma: 20

event-detector:
  engine-version: "1.0"

opportunity:
  watch-threshold: 50
  setup-threshold: 65
  strong-setup-threshold: 80
  config-version: "1.0"

risk: {}

alerts:
  cooldown: 15m
  dedup-window: 15m

historical-analyzer:
  version: "1.0"
  canonical-horizon: "1h"
  similarity:
    weights:
      magnitude: 0.3
      duration: 0.15
      volume-ratio: 0.2
      volatility: 0.2
      momentum: 0.15
    min-sample-size: 30
    max-similar-events: 50
  backfill:
    fixed-delay-ms: 300000

research:
  experiments-path: research/experiments
  outcome:
    target-definition-version: "1.0"
    stop-definition-version: "1.0"
    target-percentage: 0.01
    stop-percentage: 0.01
  evaluation:
    horizons: [5m, 15m, 30m, 1h, 4h, 12h, 24h]
    canonical-horizon: "24h"
    fixed-delay-ms: 300000

agent:
  enabled: ${AGENT_ENABLED:true}
  timeout: 30s
  max-retries: 1
  trigger-threshold: 50
  version: "1.0"
  prompt-version: "1.0"
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.1:8b}

operations:
  default-fee-rate: 0.001
  default-slippage-estimate: 0.0005
  screenshots:
    storage-path: ${SCREENSHOTS_STORAGE_PATH:./data/screenshots}
    max-size-bytes: 5242880
    allowed-content-types:
      - image/png
      - image/jpeg
      - image/webp
