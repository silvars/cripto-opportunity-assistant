version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Java 25 é LTS fixado (ADR-001). Tags Docker ("25"/"26") não são semver
      # X.Y.Z, então update-types:semver-major não casa aqui — ignorar a
      # dependência inteira é o jeito que realmente funciona.
      - dependency-name: "maven"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
